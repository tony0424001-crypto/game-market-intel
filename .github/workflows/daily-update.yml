name: Daily Game Intel Update (3-Agent)

on:
  schedule:
    # Daily at 00:30 UTC (08:30 TST)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      run_all:
        description: 'Force run all 3 agents (including product discovery)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run 3-Agent system
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.run_all }}" = "true" ]; then
            python scripts/update_data.py --all
          else
            python scripts/update_data.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Game Intel Bot"
          git add data/
          git diff --staged --quiet || git commit -m "🤖 3-Agent update $(date -u +'%Y-%m-%d %H:%M')"
          git push
